seed: 42
model_type: ngboost
pre_process_categorial: true

apply_vs30_sample_weights: true
max_vs30_weight: 1.5

apply_quality_sample_weights: true
q1_weight_factor: 1.25
q2_weight_factor: 1.0
q3_weight_factor: 0.75

rel_dataset_ffp: datasets/nz_site_db_dataset.parquet
rel_test_sites_ffp: datasets/nz_site_db_test_sites/test_sites.npy

input_variables:
  - compound_topographic_index
  - nz_geology_age_ln_mid
  - nz_combined_groundwater_depth_ln
  - nzenvds_slope_deg
  - nzenvds_topo_normalised_height
  - nzenvds_topo_position
  - nzenvds_topo_roughness
  - nzenvds_precip_ann
  - nz_distance_to_coast

n_cv_folds: 50
rel_results_dir: results/ind_results

model_config:
  iterations: 80
  learning_rate: 0.035
  minibatch_frac: 0.5
  col_sample: 0.7
  base_max_depth: 7
  base_min_samples_leaf: 10